<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Account | CL Magno I.T. Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ink: '#050505', graphite: '#171717', paper: '#f7f7f7', line: '#dddddd', signal: '#0f8ec2' } } }
        }
    </script>
    <style>
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-paper text-ink antialiased">
    <nav class="border-b border-line bg-white">
        <div class="mx-auto flex h-16 max-w-2xl items-center justify-between px-5">
            <a href="dashboard.html" class="inline-flex items-center gap-2 text-sm font-black tracking-tight hover:text-signal">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                Your Courses
            </a>
            <button id="logoutBtn" class="rounded-lg border border-line px-4 py-2 text-sm font-bold hover:bg-gray-50">Sign Out</button>
        </div>
    </nav>

    <main class="mx-auto max-w-2xl px-5 py-12">
        <div id="loadingState" class="py-24 text-center text-sm font-bold text-gray-500">Loading...</div>

        <div id="pageState" class="hidden">
            <h1 class="text-3xl font-black tracking-tight">Account</h1>
            <p id="accountEmail" class="mt-1 text-sm text-gray-500"></p>

            <form id="passwordForm" class="mt-8 space-y-4 rounded-xl border border-line bg-white p-6">
                <h2 class="text-lg font-black">Change Password</h2>
                <div>
                    <label class="mb-1 block text-xs font-black uppercase tracking-wide text-gray-500">Current Password</label>
                    <input type="password" name="currentPassword" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-ink">
                </div>
                <div>
                    <label class="mb-1 block text-xs font-black uppercase tracking-wide text-gray-500">New Password</label>
                    <input type="password" name="newPassword" required minlength="8" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-ink">
                    <p class="mt-1 text-xs text-gray-500">At least 8 characters.</p>
                </div>
                <button type="submit" class="rounded-lg bg-ink px-5 py-2.5 text-sm font-black text-white transition hover:-translate-y-0.5">Update Password</button>
                <p id="passwordStatus" class="hidden text-sm font-bold"></p>
            </form>
        </div>
    </main>

    <script src="js/portal.js"></script>
    <script>
        (async () => {
            const session = await requireAuth();
            if (!session) return;
            document.getElementById('logoutBtn').addEventListener('click', logout);

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('pageState').classList.remove('hidden');
            document.getElementById('accountEmail').textContent = session.email;

            document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const statusEl = document.getElementById('passwordStatus');
                const { ok, data } = await apiFetch('change-password', {
                    method: 'POST',
                    body: JSON.stringify({
                        currentPassword: form.currentPassword.value,
                        newPassword: form.newPassword.value
                    })
                });
                statusEl.classList.remove('hidden');
                if (ok) {
                    statusEl.textContent = 'Password updated.';
                    statusEl.className = 'text-sm font-bold text-emerald-600';
                    form.reset();
                } else {
                    statusEl.textContent = (data && data.error) || 'Could not update password.';
                    statusEl.className = 'text-sm font-bold text-red-600';
                }
            });
        })();
    </script>
</body>
</html>
