<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Manage Courses | CL Magno I.T. Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ink: '#050505', graphite: '#171717', paper: '#f7f7f7', line: '#dddddd', signal: '#0f8ec2' } } }
        }
    </script>
    <style>
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-paper text-ink antialiased">
    <nav class="border-b border-line bg-white">
        <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-5">
            <a href="../dashboard.html" class="inline-flex items-center gap-2 text-sm font-black tracking-tight hover:text-signal">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                Your Courses
            </a>
            <div class="flex items-center gap-4">
                <a id="overviewLink" href="overview.html" class="hidden text-sm font-bold hover:text-signal">Overview</a>
                <a id="studentsLink" href="students.html" class="hidden text-sm font-bold hover:text-signal">Students</a>
                <a id="registrationsLink" href="bootcamp-registrations.html" class="hidden text-sm font-bold hover:text-signal">Registrations</a>
                <a id="cohortsLink" href="cohorts.html" class="hidden text-sm font-bold hover:text-signal">Cohorts</a>
                <span id="userEmail" class="text-sm text-gray-600"></span>
                <button id="logoutBtn" class="rounded-lg border border-line px-4 py-2 text-sm font-bold hover:bg-gray-50">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-5xl px-5 py-12">
        <div id="deniedState" class="hidden py-24 text-center text-sm font-bold text-gray-500">You don't have access to this page.</div>

        <div id="pageState" class="hidden">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-black tracking-tight">Manage Courses</h1>
                    <p class="mt-2 text-sm text-gray-600">Create a course, then add modules (video, reading, quiz) to it.</p>
                </div>
                <button type="button" id="newCourseBtn" class="shrink-0 rounded-lg bg-ink px-5 py-2.5 text-sm font-black text-white transition hover:-translate-y-0.5">+ New Course</button>
            </div>

            <form id="newCourseForm" class="mt-6 hidden rounded-xl border border-line bg-white p-6">
                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label class="mb-1 block text-xs font-black uppercase tracking-wide text-gray-500">Title</label>
                        <input name="title" required class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-ink" placeholder="e.g. Intro to SQL">
                    </div>
                    <div>
                        <label class="mb-1 block text-xs font-black uppercase tracking-wide text-gray-500">Slug (used in the URL)</label>
                        <input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-ink font-mono" placeholder="intro-to-sql">
                    </div>
                </div>
                <div class="mt-4">
                    <label class="mb-1 block text-xs font-black uppercase tracking-wide text-gray-500">Description</label>
                    <textarea name="description" rows="2" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-ink"></textarea>
                </div>
                <label class="mt-4 flex items-center gap-2 text-sm">
                    <input type="checkbox" name="requiresSubscription" class="h-4 w-4">
                    Requires an active subscription (unchecked = open to any signed-in account)
                </label>
                <div class="mt-5 flex items-center gap-3">
                    <button type="submit" class="rounded-lg bg-ink px-5 py-2.5 text-sm font-black text-white transition hover:-translate-y-0.5">Create Course</button>
                    <button type="button" id="cancelNewCourseBtn" class="rounded-lg border border-line px-5 py-2.5 text-sm font-bold hover:bg-gray-50">Cancel</button>
                    <p id="newCourseError" class="hidden text-sm font-bold text-red-600"></p>
                </div>
            </form>

            <div id="courseList" class="mt-8 space-y-3"></div>
        </div>
    </main>

    <script src="../js/portal.js"></script>
    <script>
        function renderCourseRow(c) {
            const badge = c.requires_subscription
                ? '<span class="rounded-md bg-amber-100 px-2 py-1 text-[11px] font-black text-amber-700">Subscription</span>'
                : '<span class="rounded-md bg-gray-100 px-2 py-1 text-[11px] font-black text-gray-600">Open</span>';
            return `
                <a href="course.html?slug=${encodeURIComponent(c.slug)}" class="flex items-center justify-between gap-4 rounded-xl border border-line bg-white p-5 transition hover:-translate-y-0.5 hover:shadow-[0_5px_0_rgba(0,0,0,0.08)]">
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="text-lg font-black tracking-tight">${c.title}</h2>
                            ${badge}
                        </div>
                        <p class="mt-1 text-xs font-mono text-gray-500">/${c.slug}</p>
                    </div>
                    <span class="shrink-0 text-sm font-bold text-gray-500">${c.module_count} module${c.module_count === 1 ? '' : 's'} &rarr;</span>
                </a>`;
        }

        (async () => {
            const session = await requireAuth();
            if (!session) return;

            document.getElementById('userEmail').textContent = session.email;
            document.getElementById('logoutBtn').addEventListener('click', logout);
            if (session.role === 'admin') {
                document.getElementById('overviewLink').classList.remove('hidden');
                document.getElementById('studentsLink').classList.remove('hidden');
                document.getElementById('registrationsLink').classList.remove('hidden');
                document.getElementById('cohortsLink').classList.remove('hidden');
            }

            if (!session.canManageContent) {
                document.getElementById('deniedState').classList.remove('hidden');
                return;
            }
            document.getElementById('pageState').classList.remove('hidden');

            async function loadCourses() {
                const { ok, data } = await apiFetch('admin-courses');
                if (!ok) {
                    document.getElementById('courseList').innerHTML = `<p class="text-sm text-red-600">${(data && data.error) || 'Could not load courses.'}</p>`;
                    return;
                }
                document.getElementById('courseList').innerHTML = data.courses.length
                    ? data.courses.map(renderCourseRow).join('')
                    : '<p class="text-sm text-gray-600">No courses yet. Create one above.</p>';
            }

            const form = document.getElementById('newCourseForm');
            document.getElementById('newCourseBtn').addEventListener('click', () => form.classList.toggle('hidden'));
            document.getElementById('cancelNewCourseBtn').addEventListener('click', () => form.classList.add('hidden'));

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(form);
                const errorEl = document.getElementById('newCourseError');
                errorEl.classList.add('hidden');

                const { ok, data } = await apiFetch('admin-courses', {
                    method: 'POST',
                    body: JSON.stringify({
                        title: fd.get('title'),
                        slug: fd.get('slug'),
                        description: fd.get('description'),
                        requiresSubscription: fd.get('requiresSubscription') === 'on'
                    })
                });

                if (!ok) {
                    errorEl.textContent = (data && data.error) || 'Could not create the course.';
                    errorEl.classList.remove('hidden');
                    return;
                }

                form.reset();
                form.classList.add('hidden');
                loadCourses();
            });

            loadCourses();
        })();
    </script>
</body>
</html>
