<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QBSRH8GYGQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-QBSRH8GYGQ');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Course | CL Magno I.T. Solutions</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ink: '#050505', graphite: '#171717', paper: '#f7f7f7', line: '#dddddd', signal: '#0f8ec2' } } }
        }
    </script>
    <style>
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #efefef; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #bdbdbd; border-radius: 999px; }
    </style>
</head>
<body class="min-h-screen bg-paper text-ink antialiased">
    <nav class="border-b border-line bg-white">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5">
            <a href="dashboard.html" class="inline-flex items-center gap-2 text-sm font-black tracking-tight hover:text-signal">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                Your Courses
            </a>
            <div class="flex items-center gap-3">
                <a id="editCourseLink" href="#" class="hidden rounded-lg bg-ink px-4 py-2 text-sm font-black text-white hover:-translate-y-0.5">Edit This Course</a>
                <button id="logoutBtn" class="rounded-lg border border-line px-4 py-2 text-sm font-bold hover:bg-gray-50">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-7xl px-5 py-10">
        <div id="loadingState" class="py-24 text-center text-sm font-bold text-gray-500">Loading course...</div>

        <div id="courseState" class="hidden">
            <h1 id="courseTitle" class="text-4xl font-black tracking-[-0.04em]"></h1>
            <p id="courseDescription" class="mt-3 max-w-3xl text-base leading-7 text-gray-700"></p>

            <div id="subscribeBanner" class="mt-6 hidden rounded-xl border border-amber-300 bg-amber-50 p-5 sm:flex sm:items-center sm:justify-between sm:gap-6">
                <div>
                    <p class="text-xs font-black uppercase tracking-wide text-amber-700">Subscription Required</p>
                    <p class="mt-1 text-sm text-gray-700">Module 1 is free. Subscribe to unlock the rest of this course.</p>
                </div>
                <a href="billing.html" class="mt-4 inline-flex shrink-0 items-center justify-center rounded-lg bg-ink px-5 py-2.5 text-sm font-black text-white transition hover:-translate-y-0.5 sm:mt-0">Subscribe</a>
            </div>

            <div class="mt-8 grid gap-10 lg:grid-cols-[1fr_320px]">
                <div class="space-y-6">
                    <div id="playerWrap" class="relative overflow-hidden rounded-xl border border-ink bg-black pt-[56.25%] shadow-[0_7px_0_rgba(0,0,0,0.18)]">
                        <iframe id="player" class="absolute inset-0 h-full w-full" src="" title="" frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen></iframe>
                    </div>

                    <div id="activeModuleCard" class="rounded-xl border border-line bg-ink p-6 text-white shadow-[0_5px_0_rgba(0,0,0,0.18)] sm:flex sm:items-center sm:justify-between sm:gap-6">
                        <div>
                            <h3 id="activeModuleTitle" class="text-2xl font-black tracking-tight"></h3>
                            <p class="mt-1 text-sm text-white/70">Self-Paced Recording</p>
                        </div>
                        <button type="button" id="completeBtn" class="mt-5 inline-flex items-center justify-center rounded-lg bg-white px-5 py-3 text-sm font-black text-ink transition hover:-translate-y-0.5 sm:mt-0"></button>
                    </div>

                    <div id="readingCard" class="hidden rounded-xl border border-line bg-white p-6 shadow-[0_5px_0_rgba(0,0,0,0.08)] sm:p-8">
                        <h4 class="text-xs font-black uppercase tracking-wide text-gray-500">Companion Reading</h4>
                        <div id="readingContent" class="prose prose-sm mt-4 max-w-none leading-7 text-gray-800"></div>
                    </div>

                    <div id="quizCard" class="hidden rounded-xl border border-line bg-white p-6 shadow-[0_5px_0_rgba(0,0,0,0.08)] sm:p-8">
                        <div class="flex items-center justify-between">
                            <h4 class="text-xs font-black uppercase tracking-wide text-gray-500">Knowledge Check</h4>
                            <button type="button" id="startQuizBtn" class="rounded-lg bg-ink px-4 py-2 text-xs font-black text-white transition hover:-translate-y-0.5">Take the Quiz</button>
                        </div>
                        <div id="quizBody" class="mt-5 space-y-6"></div>
                    </div>
                </div>

                <aside class="overflow-hidden rounded-xl border border-gray-300 bg-[#f2f2f2] shadow-[0_5px_0_rgba(0,0,0,0.18)]">
                    <div class="border-b border-gray-300 bg-white p-5">
                        <h4 class="font-black">Course Content</h4>
                        <p id="moduleCount" class="mt-1 text-xs font-semibold text-gray-500"></p>
                    </div>
                    <div id="moduleList" class="max-h-[560px] space-y-1 overflow-y-auto p-3 custom-scrollbar"></div>
                </aside>
            </div>
        </div>
    </main>

    <script src="js/portal.js"></script>
    <script>
        const lockIcon = '<svg class="h-4 w-4 text-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>';
        const playIcon = '<svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg>';
        const checkIcon = '<svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" /></svg>';

        function renderModuleRow(m, isActive) {
            if (m.locked) {
                return `
                    <div class="flex items-center justify-between rounded-lg p-4">
                        <div class="flex items-center gap-3">
                            <span class="grid h-8 w-8 place-items-center rounded-full bg-ink text-xs font-black text-white">${m.position}</span>
                            <div><p class="text-sm font-bold">${m.position}. ${m.title}</p><p class="text-xs text-gray-500">Locked</p></div>
                        </div>
                        ${lockIcon}
                    </div>`;
            }
            const base = isActive ? 'bg-ink text-white' : 'hover:bg-white';
            const badge = m.completed
                ? `<div class="grid h-8 w-8 place-items-center rounded-full ${isActive ? 'bg-white text-green-600' : 'bg-green-600 text-white'}">${checkIcon}</div>`
                : `<div class="grid h-8 w-8 place-items-center rounded-full border ${isActive ? 'border-white/20 bg-white text-ink' : 'border-ink/10 bg-ink text-white'}">${playIcon}</div>`;
            return `
                <button type="button" data-position="${m.position}" class="module-row flex w-full items-center justify-between rounded-lg p-4 text-left transition ${base}">
                    <div class="flex items-center gap-3">
                        ${badge}
                        <div>
                            <p class="text-sm font-black">${m.position}. ${m.title}</p>
                            <p class="text-xs ${isActive ? 'text-white/70' : 'text-gray-500'}">${m.completed ? 'Completed' : (hasContent(m) ? 'Available' : 'Coming soon')}</p>
                        </div>
                    </div>
                </button>`;
        }

        function hasContent(m) {
            return Boolean(m.video_url || m.reading_content || m.hasQuiz);
        }

        (async () => {
            const session = await requireAuth();
            if (!session) return;
            document.getElementById('logoutBtn').addEventListener('click', logout);

            const slug = new URLSearchParams(window.location.search).get('slug');
            if (session.canManageContent && slug) {
                const editLink = document.getElementById('editCourseLink');
                editLink.href = `admin/course.html?slug=${encodeURIComponent(slug)}`;
                editLink.classList.remove('hidden');
            }
            if (!slug) {
                document.getElementById('loadingState').textContent = 'No course specified.';
                return;
            }

            const { ok, data } = await apiFetch(`course-content?slug=${encodeURIComponent(slug)}`);
            if (!ok) {
                document.getElementById('loadingState').textContent = (data && data.error) || 'Could not load this course.';
                return;
            }

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('courseState').classList.remove('hidden');
            document.getElementById('courseTitle').textContent = data.course.title;
            document.getElementById('courseDescription').textContent = data.course.description;
            document.getElementById('moduleCount').textContent = `${data.modules.length} Modules • Self-Paced Recordings`;

            if (data.requiresSubscription && !data.enrolled) {
                document.getElementById('subscribeBanner').classList.remove('hidden');
            }

            let active = data.modules.find((m) => !m.locked && hasContent(m)) || null;

            function renderPlayer() {
                const player = document.getElementById('player');
                const completeBtn = document.getElementById('completeBtn');
                const readingCard = document.getElementById('readingCard');
                const quizCard = document.getElementById('quizCard');

                if (!active) {
                    document.getElementById('playerWrap').classList.add('hidden');
                    document.getElementById('activeModuleCard').classList.add('hidden');
                    readingCard.classList.add('hidden');
                    quizCard.classList.add('hidden');
                    return;
                }

                document.getElementById('activeModuleTitle').textContent = `Module ${active.position}: ${active.title}`;

                if (active.video_url) {
                    player.src = active.video_url;
                    player.title = active.title;
                    document.getElementById('playerWrap').classList.remove('hidden');
                } else {
                    player.src = '';
                    document.getElementById('playerWrap').classList.add('hidden');
                }

                document.getElementById('activeModuleCard').classList.remove('hidden');
                completeBtn.textContent = active.completed ? 'Mark Incomplete' : 'Mark Complete';

                if (active.reading_content) {
                    document.getElementById('readingContent').innerHTML = window.marked
                        ? marked.parse(active.reading_content)
                        : active.reading_content;
                    readingCard.classList.remove('hidden');
                } else {
                    readingCard.classList.add('hidden');
                }

                document.getElementById('quizBody').innerHTML = '';
                document.getElementById('startQuizBtn').textContent = 'Take the Quiz';
                if (active.hasQuiz) {
                    quizCard.classList.remove('hidden');
                } else {
                    quizCard.classList.add('hidden');
                }
            }

            function renderList() {
                const list = document.getElementById('moduleList');
                list.innerHTML = data.modules.map((m) => renderModuleRow(m, active && m.position === active.position)).join('');
                list.querySelectorAll('.module-row').forEach((row) => {
                    row.addEventListener('click', () => {
                        const position = Number(row.dataset.position);
                        const chosen = data.modules.find((m) => m.position === position);
                        if (!chosen || chosen.locked || !hasContent(chosen)) return;
                        active = chosen;
                        renderPlayer();
                        renderList();
                    });
                });
            }

            document.getElementById('completeBtn').addEventListener('click', async () => {
                if (!active) return;
                const nextState = !active.completed;
                const { ok } = await apiFetch('module-progress', {
                    method: 'POST',
                    body: JSON.stringify({ slug, position: active.position, completed: nextState })
                });
                if (!ok) return;
                active.completed = nextState;
                renderPlayer();
                renderList();
            });

            document.getElementById('startQuizBtn').addEventListener('click', async () => {
                if (!active) return;
                const quizBody = document.getElementById('quizBody');
                const startBtn = document.getElementById('startQuizBtn');
                startBtn.disabled = true;

                const { ok, data: quiz } = await apiFetch(`quiz?slug=${encodeURIComponent(slug)}&position=${active.position}`);
                startBtn.disabled = false;
                if (!ok) {
                    quizBody.innerHTML = `<p class="text-sm text-red-600">${(quiz && quiz.error) || 'Could not load the quiz.'}</p>`;
                    return;
                }

                const mdInline = (text) => (window.marked ? marked.parseInline(text) : text);

                startBtn.classList.add('hidden');
                quizBody.innerHTML = quiz.questions.map((q, qi) => `
                    <div data-question-id="${q.id}">
                        <p class="text-sm font-black">${qi + 1}. ${mdInline(q.prompt)}</p>
                        <div class="mt-3 space-y-2">
                            ${q.options.map((o) => `
                                <label class="flex items-center gap-3 rounded-lg border border-line p-3 text-sm transition hover:bg-gray-50">
                                    <input type="radio" name="q-${q.id}" value="${o.id}" class="h-4 w-4 shrink-0">
                                    <span>${mdInline(o.label)}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `).join('') + `
                    <button type="button" id="submitQuizBtn" class="rounded-lg bg-ink px-5 py-2.5 text-sm font-black text-white transition hover:-translate-y-0.5">Submit Answers</button>
                    <p id="quizResult" class="hidden text-sm font-bold"></p>
                `;

                document.getElementById('submitQuizBtn').addEventListener('click', async () => {
                    const answers = quiz.questions.map((q) => {
                        const checked = quizBody.querySelector(`input[name="q-${q.id}"]:checked`);
                        return { questionId: q.id, optionId: checked ? checked.value : null };
                    });

                    const { ok: submitOk, data: result } = await apiFetch('quiz-submit', {
                        method: 'POST',
                        body: JSON.stringify({ quizId: quiz.quizId, answers })
                    });

                    const resultEl = document.getElementById('quizResult');
                    if (!submitOk) {
                        resultEl.textContent = (result && result.error) || 'Could not submit the quiz.';
                        resultEl.className = 'text-sm font-bold text-red-600';
                        resultEl.classList.remove('hidden');
                        return;
                    }

                    resultEl.textContent = `Score: ${result.score} / ${result.total}`;
                    resultEl.className = 'text-sm font-bold text-signal';
                    resultEl.classList.remove('hidden');
                    document.getElementById('submitQuizBtn').disabled = true;

                    result.results.forEach((r) => {
                        const block = quizBody.querySelector(`[data-question-id="${r.questionId}"]`);
                        if (!block) return;

                        block.querySelectorAll('input[type="radio"]').forEach((input) => {
                            input.disabled = true;
                            const label = input.closest('label');
                            if (input.value === r.correctOptionId) {
                                label.classList.add('border-emerald-400', 'bg-emerald-50');
                            } else if (input.checked) {
                                label.classList.add('border-red-300', 'bg-red-50');
                            }
                        });

                        if (r.explanation) {
                            const expl = document.createElement('p');
                            expl.className = `mt-2 rounded-lg p-3 text-xs leading-5 ${r.isCorrect ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-800'}`;
                            expl.innerHTML = `${r.isCorrect ? '&#10003; Tama!' : '&#10007; Mali.'} <strong>${mdInline(r.correctOptionLabel)}</strong> &mdash; ${mdInline(r.explanation)}`;
                            block.appendChild(expl);
                        }
                    });
                });
            });

            renderPlayer();
            renderList();
        })();
    </script>
</body>
</html>
