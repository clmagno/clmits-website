<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Your Courses | CL Magno I.T. Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { ink: '#050505', graphite: '#171717', paper: '#f7f7f7', line: '#dddddd', signal: '#0f8ec2' } } }
        }
    </script>
    <style>
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-paper text-ink antialiased">
    <nav class="border-b border-line bg-white">
        <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-5">
            <a href="https://clmits.com" class="text-sm font-black tracking-tight">CL Magno I.T. Solutions</a>
            <div class="flex items-center gap-4">
                <span id="userEmail" class="text-sm text-gray-600"></span>
                <button id="logoutBtn" class="rounded-lg border border-line px-4 py-2 text-sm font-bold hover:bg-gray-50">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="mx-auto max-w-5xl px-5 py-12">
        <h1 class="text-3xl font-black tracking-tight">Your Courses</h1>
        <p class="mt-2 text-sm text-gray-600">Module 1 of every course is free. A subscription unlocks the rest, plus readings and quizzes.</p>

        <div id="subscriptionBanner" class="mt-6 rounded-xl border p-6"></div>

        <div id="courseList" class="mt-8 grid gap-4 sm:grid-cols-2"></div>

        <div id="offeringsSection" class="mt-16 hidden">
            <h2 class="text-2xl font-black tracking-tight">Course Offerings</h2>
            <p class="mt-2 text-sm text-gray-600">Live, instructor-led bootcamps you can reserve a slot in.</p>
            <div id="offeringsList" class="mt-6 grid gap-4 sm:grid-cols-2"></div>
        </div>
    </main>

    <script src="js/portal.js"></script>
    <script>
        function statusLabel(course) {
            if (course.total_modules === 0) return { text: 'No modules yet', color: 'text-gray-500' };
            if (course.completed_modules === 0) return { text: 'Not Started', color: 'text-gray-500' };
            if (course.completed_modules >= course.total_modules) return { text: 'Completed', color: 'text-green-600' };
            return { text: 'In Progress', color: 'text-signal' };
        }

        function renderCourseCard(c) {
            const pct = c.total_modules ? Math.round((c.completed_modules / c.total_modules) * 100) : 0;
            const status = statusLabel(c);
            return `
                <a href="course.html?slug=${encodeURIComponent(c.slug)}" class="block rounded-xl border border-line bg-white p-6 shadow-[0_5px_0_rgba(0,0,0,0.08)] transition hover:-translate-y-0.5">
                    <div class="flex items-center justify-between gap-3">
                        <h2 class="text-xl font-black tracking-tight">${c.title}</h2>
                        <span class="shrink-0 text-xs font-black uppercase tracking-wide ${status.color}">${status.text}</span>
                    </div>
                    <div class="mt-4 h-2 rounded-full bg-gray-100">
                        <div class="h-2 rounded-full bg-ink" style="width: ${pct}%"></div>
                    </div>
                    <p class="mt-2 text-xs font-bold text-gray-500">${c.completed_modules} / ${c.total_modules} modules complete</p>
                </a>`;
        }

        function renderOfferingCard(o) {
            const href = `https://clmits.com/index.html?interest=${encodeURIComponent(o.inquiry_interest || '')}#contact`;
            return `
                <a href="${href}" class="block rounded-xl border border-line bg-white p-6 shadow-[0_5px_0_rgba(0,0,0,0.08)] transition hover:-translate-y-0.5">
                    <span class="rounded-md bg-ink px-3 py-1 text-[11px] font-black text-white">Live Bootcamp</span>
                    <h2 class="mt-4 text-xl font-black tracking-tight">${o.title}</h2>
                    <p class="mt-2 text-sm leading-6 text-gray-600">${o.description}</p>
                    <p class="mt-4 text-sm font-black text-signal">Reserve your slot &rarr;</p>
                </a>`;
        }

        function renderSubscriptionBanner(sub) {
            const banner = document.getElementById('subscriptionBanner');
            if (sub && sub.active) {
                const until = new Date(sub.until).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
                banner.className = 'mt-6 rounded-xl border border-green-200 bg-green-50 p-6 sm:flex sm:items-center sm:justify-between sm:gap-6';
                banner.innerHTML = `
                    <div>
                        <p class="text-xs font-black uppercase tracking-wide text-green-700">Subscription Active</p>
                        <p class="mt-1 text-sm text-gray-700">Renews/expires ${until}.</p>
                    </div>
                    <a href="billing.html" class="mt-4 inline-flex shrink-0 items-center justify-center rounded-lg border border-line bg-white px-5 py-2.5 text-sm font-black text-ink transition hover:-translate-y-0.5 sm:mt-0">Manage Billing</a>`;
            } else {
                banner.className = 'mt-6 rounded-xl border border-line bg-white p-6 sm:flex sm:items-center sm:justify-between sm:gap-6';
                banner.innerHTML = `
                    <div>
                        <p class="text-xs font-black uppercase tracking-wide text-gray-500">No Active Subscription</p>
                        <p class="mt-1 text-sm text-gray-700">Subscribe to unlock every module, reading, and quiz.</p>
                    </div>
                    <a href="billing.html" class="mt-4 inline-flex shrink-0 items-center justify-center rounded-lg bg-ink px-5 py-2.5 text-sm font-black text-white transition hover:-translate-y-0.5 sm:mt-0">Subscribe</a>`;
            }
        }

        (async () => {
            const session = await requireAuth();
            if (!session) return;

            document.getElementById('userEmail').textContent = session.email;
            document.getElementById('logoutBtn').addEventListener('click', logout);
            renderSubscriptionBanner(session.subscription);

            const list = document.getElementById('courseList');
            if (!session.courses.length) {
                list.innerHTML = '<p class="text-sm text-gray-600">No courses available yet.</p>';
            } else {
                list.innerHTML = session.courses.map(renderCourseCard).join('');
            }

            if (session.offerings && session.offerings.length) {
                document.getElementById('offeringsSection').classList.remove('hidden');
                document.getElementById('offeringsList').innerHTML = session.offerings.map(renderOfferingCard).join('');
            }
        })();
    </script>
</body>
</html>
